<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — CashLand</title>
    <link rel="stylesheet" href="/template.css">
</head>

<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-box">
            <div style="margin: auto 0;">
                <p>Carregando... </p>
            </div>
            <div class="spinning-wheel"></div>
        </div>
    </div>

    <div class="loading-overlay" id="resultado-overlay">
        <div class="loading-box" id="resultado-funcao">
        </div>
    </div>

    <div class="container">
        <div id="div-Login" class="cartao">
            <div id="id-Titulo">
                <h1>CashLand</h1>
            </div>
            <form action="" id="meuForm">
                <label for="Email">Email: </label><br>
                <input type="text" name="Email" id="Email">
                <div id="erro-email"></div>

                <label for="Senha" style="margin-bottom: 5px;">Senha:</label><br>
                <div class="campo-senha">
                    <input type="password" name="Senha" id="Senha">
                    <button type="button" id="mostrar-senha">👁</button>
                </div>
                <div id="erro-senha"></div>
                <a href="/resetar-senha">Esqueci minha senha</a>
                <a href="/cadastro-usuario">Cadastrar novo usuario</a>

                <input type="submit" value="Enviar">
            </form>
        </div>
    </div>
    <script src="./validacao-joi.bundle.js"></script>
    <script>
        let liberarAcesso = false;
        let resetSolicitado = false;
        let enviando = false;
        const loading = document.getElementById("loading-overlay");
        const resultado_overlay = document.getElementById("resultado-overlay");
        function MostrarErro(id, mensagem) {
            document.getElementById(id).innerHTML = `
            <h5 style="color: var(--erro); margin-left: 10px;font-size:13px">${mensagem}</h5> `;
        }
        function MostrarResultado_Overlay(tipo, mensagem) {
            if (tipo == 1) {
                document.getElementById("resultado-funcao").innerHTML =
                    `<div id="div-resultado-overlay"
                    class="dialogo-conteudo">
                    <div>
                        <h5 style="color: var(--sucesso); margin: 0;">${mensagem}</h5>
                    </div>
                    <div class="acoes-formulario">
                     <input class="botao-dialogo" type="button" onclick="FechaResultado_overlay()" value="Continuar">
                    </div>
                </div>`
            } else {
                document.getElementById("resultado-funcao").innerHTML =
                    `<div id="div-resultado-overlay"
                    class="dialogo-conteudo">
                    <div>
                        <h5 style="color: var(--erro); margin: 0;">${mensagem}</h5>
                    </div>
                    <div class="acoes-formulario">
                     <input class="botao-dialogo" type="button" onclick="FechaResultado_overlay()" value="Continuar">
                    </div>
                </div>`
            }
        }
        function FechaResultado_overlay() {
            if (liberarAcesso) {
                console.log("Acesso liberado")
                window.location.href = localStorage.getItem('tipo') === 'Admin' ? '/tela-admin' : '/tela-principal';
                resultado_overlay.style.display = "none"
            } else if (resetSolicitado) {
                resetSolicitado = false;
                resultado_overlay.style.display = "none"
                window.location.href = '/resetar-senha'
            }
            else {
                resultado_overlay.style.display = "none"
            }
        }
        // Sistema para mostrar a senha
        const campoSenha = document.getElementById("Senha");
        const mostrarSenha = document.getElementById("mostrar-senha");


        mostrarSenha.addEventListener("click", () => {
            if (campoSenha.type === "password") {
                campoSenha.type = "text";
                mostrarSenha.textContent = "🙈";
            } else {
                campoSenha.type = "password";
                mostrarSenha.textContent = "👁";
            }
        });
        document.getElementById("meuForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (enviando) return;
            enviando = true;
            liberarAcesso = false;
            resetSolicitado = false;
            const email = document.getElementById("Email").value.trim();
            const senha = document.getElementById("Senha").value;

            loading.style.display = "flex"
            try {
                const response = await fetch(`/login`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const resultado = await response.json();

                switch (response.status) {
                    // SUCESSO
                    case 200:
                        const respostaSessao = await fetch('/me', {
                            method: 'GET',
                            credentials: 'include'
                        });
                        const sessao = await respostaSessao.json();
                        if (respostaSessao.status !== 200) {
                            resultado_overlay.style.display = "flex";
                            MostrarResultado_Overlay(0, sessao.mensagem || `Não foi possível verificar a sessão (HTTP ${respostaSessao.status}).`);
                            break;
                        }
                        resultado_overlay.style.display = "flex";
                        MostrarResultado_Overlay(1, resultado.mensagem)
                        console.log(resultado.mensagem)

                        localStorage.setItem('tipo', sessao.tipo);
                        liberarAcesso = true;
                        break;
                    case 203:
                        resultado_overlay.style.display = "flex";
                        MostrarResultado_Overlay(0, resultado.mensagem)
                        console.log(resultado.mensagem)
                        resetSolicitado = true;
                        break;
                    // ERROS:
                    case 400:
                        if (resultado.erros?.length) {
                            MostrarErro("erro-email", "");
                            MostrarErro("erro-senha", "");
                            resultado.erros.forEach(erro => {
                                MostrarErro(`erro-${erro.campo}`, erro.mensagem);
                            });
                        }
                        break;
                    case 401:
                    case 403:
                    case 429:
                        resultado_overlay.style.display = "flex";
                        MostrarResultado_Overlay(0, resultado.mensagem)
                        console.log(resultado.mensagem)
                        break;
                    default:
                        resultado_overlay.style.display = "flex";
                        MostrarResultado_Overlay(0, resultado.mensagem || `Não foi possível entrar (HTTP ${response.status}).`);
                        break;
                }
            } catch {
                resultado_overlay.style.display = "flex";
                MostrarResultado_Overlay(0, 'Não foi possível entrar. Verifique a conexão e tente novamente.');
            } finally {
                loading.style.display = "none";
                enviando = false;
            }
        })

        const erroLogin = sessionStorage.getItem('erro-login');
        if (erroLogin) {
            sessionStorage.removeItem('erro-login');
            resultado_overlay.style.display = "flex";
            MostrarResultado_Overlay(0, erroLogin);
        }
    </script>
</body>

</html>
