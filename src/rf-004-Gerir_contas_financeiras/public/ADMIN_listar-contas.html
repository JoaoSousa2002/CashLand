<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas financeiras — Admin — CashLand</title>
    <link rel="stylesheet" href="/template.css">
</head>

<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-box">
            <div style="margin: auto 0;">
                <p>Carregando... </p>
            </div>
            <div class="spinning-wheel"></div>
        </div>
    </div>

    <div class="loading-overlay" id="resultado-overlay">
        <div class="loading-box" id="resultado-funcao">
            <div id="div-resultado-overlay"
                class="dialogo-conteudo">
                <div class="confirmacao-exclusao">
                    <h5 id="resultado-mensagem" style="margin: 0; white-space: pre-line;"></h5>
                    <p id="aviso-exclusao" hidden>Essa ação não poderá ser desfeita</p>
                </div>
                <div class="acoes-formulario">
                    <input class="botao-dialogo" type="button" id="confirmar-exclusao" value="Continuar" onclick="excluirConta()" hidden>
                    <input class="botao-dialogo" type="button" id="fechar-resultado" value="Continuar" onclick="FechaResultado_overlay()">
                </div>
            </div>
        </div>
    </div>
    <div id="container">
        <div id="div-superior">

            <div id="div-nome-sistema">
                <a href="/tela-admin">
                    <h1>CashLand</h1>
                </a>
            </div>

            <div id="div-nav">
                <nav>
                    <a href="/tela-admin/listar-usuarios">Gerir usuários</a>
                    <a href="/tela-admin/listar-categoria">Gerir categorias</a>
                    <a href="/tela-admin/listar-contas">Gerir contas financeiras</a>
                </nav>
            </div>
            <div id="div-nome-usuario">
                <h3><span id="nome-usuario"></span></h3>
            </div>
            <div id="div-usuario">
                <a onclick="redirecionaTela()">
                    <img src="/User_icon_black.png" alt="icone usuario">
                </a>
            </div>
            <div id="form-logout">
                <form id="meuForm-Logout">
                    <input type="submit" value="Sair">
                </form>
            </div>
        </div>
        <div id="container-conteudo" class="pagina-listagem">
            <div id="div-form-tabela">
                <h2>Contas financeiras</h2>
                <form id="form-listar-contas" novalidate>
                    <label for="pesquisa-conta">ID da conta ou nome (opcional):
                        <input type="text" name="pesquisa" id="pesquisa-conta" maxlength="100"
                            placeholder="Todas as contas" aria-describedby="erro-pesquisa">
                        <span id="erro-pesquisa" class="error-message" aria-live="polite"></span>
                    </label>
                    <label for="pesquisa-usuario">ID do usuário (opcional):
                        <input type="text" name="id_usuario" inputmode="numeric" id="pesquisa-usuario"
                            placeholder="Todos os usuários" aria-describedby="erro-id_usuario">
                        <span id="erro-id_usuario" class="error-message" aria-live="polite"></span>
                    </label>
                    <input type="submit" value="Pesquisar">
                </form>
            </div>
            <div id="div-tabela">
                <table class="tabela-listagem tabela-admin">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 70px;">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Código</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Instituição</th>
                            <th scope="col" style="width: 100px;">Status</th>
                            <th scope="col" style="width: 90px;">ID usuário</th>
                            <th scope="col">Usuário</th>
                            <th scope="col" id="th-opcoes" style="width: 170px;">Opções</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/protecao.js"></script>
    <script>
        let retornarLogin = false;
        let sessaoPronta = false;
        let carregando = false;
        let excluindo = false;
        let contaExcluir = null;
        let recarregarPagina = false;
        const loading = document.getElementById('loading-overlay');
        const resultado_overlay = document.getElementById('resultado-overlay');
        const filtro = document.getElementById('pesquisa-conta');
        const filtroUsuario = document.getElementById('pesquisa-usuario');
        const params = new URLSearchParams(window.location.search);
        if (params.has('id_usuario')) {
            filtroUsuario.value = params.get('id_usuario');
        }

        function MostrarErro(id, mensagem) {
            const elemento = document.getElementById(id);
            if (!elemento) return;
            elemento.textContent = mensagem;
            elemento.style.display = mensagem ? 'block' : 'none';
        }

        function MostrarResultado_Overlay(tipo, mensagem) {
            document.getElementById('confirmar-exclusao').hidden = true;
            document.getElementById('aviso-exclusao').hidden = true;
            document.getElementById('fechar-resultado').value = 'Continuar';
            const texto = document.getElementById('resultado-mensagem');
            texto.textContent = mensagem;
            if (tipo === 1) {
                texto.style.color = 'var(--sucesso)';
            } else {
                texto.style.color = 'var(--erro)';
            }
            resultado_overlay.style.display = 'flex';
        }

        async function FechaResultado_overlay() {
            if (excluindo) return;
            contaExcluir = null;
            resultado_overlay.style.display = 'none';
            if (retornarLogin) {
                window.location.href = '/login';
            } else if (recarregarPagina) {
                recarregarPagina = false;
                await listarContas();
            }
        }

        function mensagemResposta(resposta, dados) {
            if (dados && dados.mensagem) {
                return dados.mensagem;
            } else if (dados && dados.erro) {
                return dados.erro;
            } else {
                return `Não foi possível concluir a operação (HTTP ${resposta.status}).`;
            }
        }

        async function redirecionaTela() {
            const usuario = await protegerPagina('Admin');
            if (!usuario) return;
            window.location.href = `/tela-admin/editar-usuarios?id=${usuario.id_usuario}`;
        }

        function renderizarTabela(contas) {
            const corpo = document.getElementById('corpo-tabela');
            corpo.replaceChildren();
            if (contas.length === 0) {
                const linha = document.createElement('tr');
                linha.id = 'linha-vazia';
                const coluna = document.createElement('td');
                coluna.colSpan = 9;
                coluna.textContent = 'Nenhuma conta encontrada.';
                linha.appendChild(coluna);
                corpo.appendChild(linha);
                return;
            }
            contas.forEach(conta => {
                const linha = document.createElement('tr');
                let nomeUsuario = '---';
                if (conta.usuarios && conta.usuarios.nome) {
                    nomeUsuario = conta.usuarios.nome;
                }
                const valores = [conta.id_conta, conta.nome_conta, conta.codigo_conta ?? '---',
                    conta.tipo_conta, conta.nome_instituicao ?? '---', conta.status_conta,
                    conta.id_usuario, nomeUsuario];
                valores.forEach(valor => {
                    const coluna = document.createElement('td');
                    coluna.textContent = valor;
                    coluna.title = coluna.textContent;
                    linha.appendChild(coluna);
                });
                const opcoes = document.createElement('td');
                opcoes.className = 'td-opcoes';
                const acoes = document.createElement('div');
                acoes.className = 'acoes-tabela';
                const editar = document.createElement('button');
                editar.type = 'button';
                editar.textContent = 'Editar';
                editar.addEventListener('click', () => {
                    window.location.href = `/tela-admin/editar-conta?id_conta=${encodeURIComponent(conta.id_conta)}&id_usuario=${encodeURIComponent(conta.id_usuario)}`;
                });
                acoes.appendChild(editar);
                const excluir = document.createElement('button');
                excluir.type = 'button';
                excluir.textContent = 'Excluir';
                excluir.className = 'botao-excluir';
                excluir.addEventListener('click', () => confirmarDelete(conta));
                acoes.appendChild(excluir);
                opcoes.appendChild(acoes);
                linha.appendChild(opcoes);
                corpo.appendChild(linha);
            });
        }

        function confirmarDelete(conta) {
            if (!sessaoPronta || carregando || excluindo) return;
            contaExcluir = conta;
            MostrarResultado_Overlay(0, `Tem certeza que deseja excluir a conta "${conta.nome_conta}" (ID ${conta.id_conta}) do usuário ${conta.id_usuario}?`);
            document.getElementById('confirmar-exclusao').hidden = false;
            document.getElementById('aviso-exclusao').hidden = false;
            document.getElementById('fechar-resultado').value = 'Cancelar';
            document.getElementById('fechar-resultado').focus();
        }

        async function excluirConta() {
            if (!sessaoPronta || excluindo || !contaExcluir) return;
            excluindo = true;
            const conta = contaExcluir;
            contaExcluir = null;
            resultado_overlay.style.display = 'none';
            loading.style.display = 'flex';
            try {
                const resposta = await fetch(`/admin/deletar-conta/${encodeURIComponent(conta.id_conta)}/${encodeURIComponent(conta.id_usuario)}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const dados = await resposta.json();
                switch (resposta.status) {
                    case 200:
                        recarregarPagina = true;
                        MostrarResultado_Overlay(1, dados.mensagem);
                        break;
                    case 400:
                        if (Array.isArray(dados.erros)) {
                            dados.erros.forEach(erro => {
                                MostrarErro(`erro-${erro.campo}`, erro.mensagem);
                            });
                        } else {
                            MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        }
                        break;
                    case 401:
                        retornarLogin = true;
                        sessaoPronta = false;
                        MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        break;
                    default:
                        MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        break;
                }
            } catch {
                MostrarResultado_Overlay(0, 'Não foi possível confirmar a exclusão. Pesquise novamente antes de tentar excluir outra vez.');
            } finally {
                excluindo = false;
                loading.style.display = 'none';
            }
        }

        async function listarContas() {
            if (!sessaoPronta || carregando || excluindo) return;
            carregando = true;
            loading.style.display = 'flex';
            document.getElementById('corpo-tabela').replaceChildren();
            MostrarErro('erro-pesquisa', '');
            MostrarErro('erro-id_usuario', '');
            try {
                let rota = '/admin/listar-contas';
                const pesquisa = filtro.value.trim();
                const idUsuario = filtroUsuario.value.trim();
                const parametros = new URLSearchParams();
                if (pesquisa !== '') {
                    parametros.set('pesquisa', pesquisa);
                }
                if (idUsuario !== '') {
                    parametros.set('id_usuario', idUsuario);
                }
                if (parametros.toString() !== '') {
                    rota += `?${parametros.toString()}`;
                }
                const resposta = await fetch(rota, { method: 'GET', credentials: 'include' });
                const dados = await resposta.json();
                switch (resposta.status) {
                    case 200:
                        if (Array.isArray(dados)) {
                            renderizarTabela(dados);
                        } else if (dados && dados.mensagem) {
                            renderizarTabela([]);
                            MostrarResultado_Overlay(0, dados.mensagem);
                        } else {
                            throw new Error('Formato de resposta inesperado.');
                        }
                        break;
                    case 400:
                        if (Array.isArray(dados.erros)) {
                            dados.erros.forEach(erro => {
                                MostrarErro(`erro-${erro.campo}`, erro.mensagem);
                            });
                        } else {
                            MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        }
                        break;
                    case 401:
                        retornarLogin = true;
                        sessaoPronta = false;
                        MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        break;
                    case 404:
                    case 409:
                        renderizarTabela([]);
                        MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        break;
                    case 403:
                    case 429:
                    case 500:
                    default:
                        MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        break;
                }
            } catch {
                MostrarResultado_Overlay(0, 'Não foi possível carregar as contas. Tente novamente.');
            } finally {
                carregando = false;
                loading.style.display = 'none';
            }
        }

        document.getElementById('form-listar-contas').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            await listarContas();
        });
        document.getElementById('meuForm-Logout').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            loading.style.display = 'flex';
            try {
                const resposta = await fetch('/logout', { method: 'POST', credentials: 'include' });
                const dados = await resposta.json();
                switch (resposta.status) {
                    case 200:
                        localStorage.removeItem('tipo');
                        window.location.href = '/login';
                        break;
                    case 401:
                        retornarLogin = true;
                        sessaoPronta = false;
                        MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        break;
                    default:
                        MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                        break;
                }
            } catch {
                MostrarResultado_Overlay(0, 'Não foi possível sair. Tente novamente.');
            } finally {
                loading.style.display = 'none';
            }
        });

        async function iniciar() {
            loading.style.display = 'flex';
            try {
                const usuario = await protegerPagina('Admin');
                if (!usuario) return;
                document.getElementById('nome-usuario').textContent = usuario.nome.slice(0, 8);
                sessaoPronta = true;
                await listarContas();
            } finally {
                loading.style.display = 'none';
            }
        }
        iniciar();
    </script>
</body>
</html>
