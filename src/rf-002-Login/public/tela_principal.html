<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/CashLand%20emerald%20C%20icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — CashLand</title>
    <link rel="stylesheet" href="/template.css">
    <script src="/menu-superior.js" defer></script>
    <style>
        #titulo-dashboard {
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
        }
        #titulo-orcamentos { margin-bottom: 16px; }
        #tabela-orcamentos .coluna-ver { width: 84px; }
        #tabela-orcamentos td:nth-child(2) {
            white-space: normal;
            overflow-wrap: anywhere;
        }
        #tabela-orcamentos .orcamento-verde td { background-color: #d9efdf; }
        #tabela-orcamentos .orcamento-amarelo td { background-color: #fff1bd; }
        #tabela-orcamentos .orcamento-vermelho td { background-color: #f8d7da; }
    </style>
</head>

<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-box">
            <div style="margin: auto 0;">
                <p>Carregando... </p>
            </div>
            <div class="spinning-wheel"></div>
        </div>
    </div>

    <div class="loading-overlay" id="resultado-overlay">
        <div class="loading-box" id="resultado-funcao">
        </div>
    </div>
    <div id="container">
        <div id="div-superior">

            <div id="div-nome-sistema">
                <a href="/tela-principal">
                    <h1>CashLand</h1>
                </a>
            </div>

            <div id="div-nav">
                <button id="botao-opcoes" type="button" aria-expanded="false" aria-controls="lista-opcoes">
                    Opções <span aria-hidden="true">▾</span>
                </button>
                <nav id="lista-opcoes" aria-label="Opções de navegação" hidden>
                    <a href="/tela-principal/listar-categoria">Gerir categorias</a>
                    <a href="/tela-principal/listar-contas">Gerir contas financeiras</a>
                    <a href="/tela-principal/criar-transacao">Adicionar transação</a>
                    <a href="/tela-principal/listar-transacoes">Gerir transações</a>
                    <a href="/tela-principal/listar-metas">Gerir metas</a>
                </nav>
            </div>
            <div id="div-resumo-usuario">
                <div id="div-saldo-usuario">
                    <button id="botao-saldo-usuario" type="button" aria-expanded="false" aria-controls="lista-contas-saldo">
                        <small>Saldo atual <span aria-hidden="true">▾</span></small>
                        <strong id="saldo-usuario" aria-live="polite">Carregando...</strong>
                        <small id="nome-conta-saldo">Selecionar conta</small>
                    </button>
                    <div id="lista-contas-saldo" hidden>
                        <label for="conta-saldo-usuario">Conta financeira</label>
                        <select id="conta-saldo-usuario" size="3" disabled></select>
                    </div>
                </div>
                <div id="div-nome-usuario">
                    <h3><span id="nome-usuario"></span></h3>
                </div>
            </div>
            <div id="div-usuario">
                <a onclick="redirecionaTela()">
                    <img src="/User_icon_black.png" alt="icone usuario">
                </a>
            </div>
            <div id="form-logout">
                <form id="meuForm-Logout">
                    <input type="submit" value="Sair">
                </form>
            </div>
        </div>
        <div id="container-conteudo" class="pagina-listagem">
            <h2 id="titulo-dashboard">Dashboard</h2>
            <section id="div-tabela" tabindex="0" aria-labelledby="titulo-orcamentos">
                <h3 id="titulo-orcamentos">Orçamentos atuais</h3>
                <table id="tabela-orcamentos" class="tabela-listagem" aria-labelledby="titulo-orcamentos">
                    <thead>
                        <tr>
                            <th scope="col" class="coluna-ver">Ver</th>
                            <th scope="col">Nome do orçamento</th>
                            <th scope="col">Valor atual</th>
                            <th scope="col">Valor do orçamento</th>
                            <th scope="col">Início do período</th>
                            <th scope="col">Fim do período</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-orcamentos" aria-live="polite">
                        <tr><td colspan="6">Carregando orçamentos atuais...</td></tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>

    <script src="/protecao.js"></script>
    <script>
        let retonarLogin = false;
        const loading = document.getElementById("loading-overlay");
        const resultado_overlay = document.getElementById("resultado-overlay");

        function MostrarResultado_Overlay(tipo, mensagem) {
            if (tipo == 1) {
                document.getElementById("resultado-funcao").innerHTML =
                    `<div id="div-resultado-overlay"
                    class="dialogo-conteudo">
                    <div>
                        <h5 style="color: var(--sucesso); margin: 0;">${mensagem}</h5>
                    </div>
                    <div class="acoes-formulario">
                     <input class="botao-dialogo" type="button" onclick="FechaResultado_overlay()" value="Continuar">
                    </div>
                </div>`
            } else {
                document.getElementById("resultado-funcao").innerHTML =
                    `<div id="div-resultado-overlay"
                    class="dialogo-conteudo">
                    <div>
                        <h5 style="color: var(--erro); margin: 0;">${mensagem}</h5>
                    </div>
                    <div class="acoes-formulario">
                     <input class="botao-dialogo" type="button" onclick="FechaResultado_overlay()" value="Continuar">
                    </div>
                </div>`
            }
        }
        function FechaResultado_overlay() {
            if (!retonarLogin) {
                resultado_overlay.style.display = "none"
            } else if (retonarLogin) {
                window.location.href = "/login"
            }
        }
        async function protegerPagina(tipoExigido = null) {
            loading.style.display = 'flex';
            try {
                const resposta = await fetch('/me', {
                    method: 'GET',
                    credentials: 'include',
                });
                const usuario = await resposta.json();
                switch (resposta.status) {
                    case 200:
                        console.log("Usuario autenticado")
                        break;
                    case 401:
                        resultado_overlay.style.display = "flex";
                        MostrarResultado_Overlay(0, usuario.mensagem)
                        console.log(usuario.mensagem)
                        retonarLogin = true;
                        return;
                    case 429:
                        resultado_overlay.style.display = 'flex';
                        MostrarResultado_Overlay(0, usuario.mensagem || 'Limite de requisições atingido. Tente novamente mais tarde.');
                        return;
                    default:
                        resultado_overlay.style.display = "flex";
                        MostrarResultado_Overlay(0, usuario.mensagem || `Não foi possível verificar a sessão (HTTP ${resposta.status}).`);
                        return;
                }

                if (tipoExigido && usuario.tipo !== tipoExigido) {
                    window.location.href = '/tela-principal'; // logado, mas sem permissão
                    return;
                }

                return usuario; // devolve os dados pra página usar (ex: mostrar nome)
            } catch {
                resultado_overlay.style.display = "flex";
                MostrarResultado_Overlay(0, 'Não foi possível verificar a sessão. Verifique a conexão e tente novamente.');
            } finally {
                loading.style.display = 'none';
            }
        }

        async function redirecionaTela(){
            const data = await protegerPagina()
            if (!data) return;
            if (data.tipo === 'Comum') {
                window.location.href = '/tela-principal/editar-usuario'
            } else if (data.tipo === 'Admin') {
                window.location.href = `/tela-admin/editar-usuarios?id=${data.id_usuario}`
            }
        }
        function formatarValor(valor) {
            return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatarData(valor) {
            const [ano, mes, dia] = valor.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function mostrarMensagemOrcamentos(mensagem) {
            const corpo = document.getElementById('corpo-orcamentos');
            const linha = document.createElement('tr');
            const coluna = document.createElement('td');
            coluna.colSpan = 6;
            coluna.textContent = mensagem;
            linha.appendChild(coluna);
            corpo.replaceChildren(linha);
        }

        function renderizarOrcamentos(registros) {
            const corpo = document.getElementById('corpo-orcamentos');
            corpo.replaceChildren();
            if (registros.length === 0) {
                mostrarMensagemOrcamentos('Nenhum orçamento atual.');
                return;
            }
            for (const registro of registros) {
                const linha = document.createElement('tr');
                // Os valores da API têm duas casas decimais; compare centavos inteiros.
                const valorAtual = Math.round(Number(registro.valor_atual) * 100);
                const valorOrcamento = Math.round(Number(registro.valor_orcamento) * 100);
                const valorRestante = valorOrcamento - valorAtual;
                if (valorRestante < 0) {
                    linha.className = 'orcamento-vermelho';
                } else if (valorRestante < 10000) {
                    linha.className = 'orcamento-amarelo';
                } else {
                    linha.className = 'orcamento-verde';
                }

                const colunaVer = document.createElement('td');
                const botaoVer = document.createElement('button');
                botaoVer.type = 'button';
                botaoVer.textContent = 'ver';
                botaoVer.addEventListener('click', () => {
                    const parametros = new URLSearchParams({ id_orcamento: registro.id_orcamento });
                    window.location.href = `/tela-principal/editar-orcamento?${parametros}`;
                });
                colunaVer.appendChild(botaoVer);
                linha.appendChild(colunaVer);

                const valores = [registro.nome, formatarValor(registro.valor_atual),
                    formatarValor(registro.valor_orcamento), formatarData(registro.periodo_inicio),
                    formatarData(registro.periodo_fim)];
                for (const valor of valores) {
                    const coluna = document.createElement('td');
                    coluna.textContent = valor;
                    coluna.title = coluna.textContent;
                    linha.appendChild(coluna);
                }
                corpo.appendChild(linha);
            }
        }

        async function carregarOrcamentos() {
            mostrarMensagemOrcamentos('Carregando orçamentos atuais...');
            try {
                const hoje = new Intl.DateTimeFormat('en-CA', {
                    timeZone: 'America/Sao_Paulo',
                    year: 'numeric', month: '2-digit', day: '2-digit'
                }).format(new Date());
                const parametros = new URLSearchParams({ periodo_inicio: hoje, periodo_fim: hoje });
                const resposta = await fetch(`/usuario/listar-orcamentos?${parametros}`, { credentials: 'include' });
                if (!resposta.ok) {
                    throw new Error('Não foi possível consultar os orçamentos.');
                }
                const registros = await resposta.json();
                if (!Array.isArray(registros)) {
                    throw new Error('Resposta inesperada.');
                }
                renderizarOrcamentos(registros);
            } catch {
                mostrarMensagemOrcamentos('Não foi possível consultar os orçamentos. Recarregue a página para tentar novamente.');
            }
        }

        protegerPagina().then(usuario => {
            if (!usuario) return;
            document.getElementById('nome-usuario').textContent = usuario.nome.slice(0, 8);
            atualizarSaldoUsuario(usuario.id_usuario);
            carregarOrcamentos();
        });

        document.getElementById("meuForm-Logout").addEventListener("submit", async (e) => {
            e.preventDefault();
            const resposta = await fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            });
            if (resposta.status === 429) {
                const dados = await resposta.json().catch(() => ({}));
                loading.style.display = 'none';
                resultado_overlay.style.display = 'flex';
                MostrarResultado_Overlay(0, dados.mensagem || 'Limite de requisições atingido. Tente novamente mais tarde.');
                return;
            }
            console.log(resposta.mensagem)

            localStorage.removeItem('tipo');
            window.location.href = '/login';
        });
    </script>
</body>

</html>
