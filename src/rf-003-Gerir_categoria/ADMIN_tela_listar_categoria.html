<!DOCTYPE html>                                     
<html lang="pt-BR"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Listar Categorias (RF003) - CashLand</title>
    
    <link rel="stylesheet" href="/template.css">
    <style>
        [hidden] {display: none !important;}
        .tabela-admin {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .tabela-admin th, .tabela-admin td {
            padding: 10px 14px;
            border:1px solid #ddd;
            text-align: left;
        }
        .tabela-admin th{
            background-color: #2c3e50;
            color: #ffffff;
        }
        .campo-filtro{
            display: flex;
            gap:10px;
            margin-bottom:20px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class = "loading-overlay" id="loading-overlay" role="status" style="display: none;">
        <div class="loading-box">
            <p>Caregando categorias do sistema...</p>
            <div class="spinning-wheel" aria-hidden="true"></div>
        </div>


        <div class="loading-overlay" id="resultado-overlay" role="dialog" aria-modal="true" style="display: none;">
            <div class="loading-box" style="flex-direction: column; gap: 16px;">
                <h2 id="resultado-titulo"></h2>
                <p id="resultado-mensagem"></p>
                <button id="fechar-resultado" type="button">Fechar</button>
            </div>
        </div>
    </div>

    <main class="container" id="conteudo" hidden>
        <div class="cartao">
            <h1>Administração de Categorias</h1>
            <p>Administrador logado: <strong id="nome-admin"></strong></p>    
        

         <table class="tabela-admin">
             <thead>
                 <tr>
                     <th>ID Categoria</th>
                     <th>Nome</th>
                     <th>Descrição</th>
                     <th>ID Usuário</th>
                     <th>Propriedades da Categoria</th>
                 </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
         </table>
        </div>
    </main>
    <script src="/protecao.js"></script>

    <script>
        const loading = document.getElementById("loading-ovarlay");
        const resultado = document.getElementById("resultado-overlay");
        const conteudo = document.getElementById("conteudo");
        const tabelaCorpo = document.getElementById("tabela-corpo");
        const inputFiltroId = document.getElementById("filtro-id-usuario");

        function mostrarLoading(exibir) {
            loading.style.display = exibir ? "flex" : "none";
        }

        function mostrarErro(mensagem) {
            document.getElementById("resultado-titulo").textContent = "Atenção";
            document.getElementById("resultado-titulo").style.color = "darkred";
            document.getElementById("resultado-titulo").textContent = mensagem;
            resultado.style.display = "flex";
        }

        document.getElementById("fechar-resultado").addEventListener("click" , () => {
            resultado.style.display = "none";
        })

        async function inicializarAdmin() {
            mostrarLoading(true);
            try {
                const admin = await protegerPagina('Admin');
                if (!admin) return;

                document.getElementById('nome-admin').textContent = admin.nome;
                conteudo.hidden = false;

                await buscarCategoriasAdmin();
            } catch (erro) { 
                 mostrarErro("Erro de permissão: " + erro.mensagem);
             }finally {
                mostrarLoading(false);
             }
        }
        
        async function buscarCategoriasAdmin(idUsuario = "") {
            mostrarLoading(true);
            try{
                const termo = idUsuario.toString().trim();
                const query = termo ? `?id=${encodeURIComponent(termo)}` : "";

                const resposta = await fetch(`/admin/listar-categoria${query}`, {
                    method: 'GET',
                    credentials: 'include'
            });
            const dados = await resposta.json();

            if(!resposta.ok) {
                throw new Error(dados.mensagem || dados.erro || `Erro HTTP ${resposta.status}`);
            }

            const listaCategorias = dados.constaPorID || [];
            renderizarTabela(listaCategorias);
        }catch (erro) {
            mostrarErro("Falha ao buscar categorias: " + erro.mensagem);
        }finally {
            mostrarLoading(false);
        }
            
        }

        function renderizarTabela(lista) {
            tabelaCorpo.replaceChildren();
            
            if (!Array.isArray(lista) || lista.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 5;
                td.textContent = "Nenhuma categoria cadastrada ou encontrada para este filtro.";
                td.style.textAlign = "center";
                tr.appendChild(td);
                tabelaCorpo.appendChild(tr);
                return;
            }
            lista.forEach(cat => {
                const tr = document.createElement('tr');

                const tdCatId = document.createElement('td');
                tdCatId.textContent = cat.id_categoria;

                const tdNome = document.createElement('td');
                tdNome.textContent = cat.nome;

                const tdDesc = document.createElement('td');
                tdDesc.textContent = cat.descricao || '-';

                const tdUserId = document.createElement('td');
                tdUserId.textContent = cat.id_usuario;

                const tdUserNome = document.createElement('td');
                
                tdUserNome.textContent = cat.usuarios ? cat.usuarios.nome : 'N/A';

                tr.appendChild(tdCatId);
                tr.appendChild(tdNome);
                tr.appendChild(tdDesc);
                tr.appendChild(tdUserId);
                tr.appendChild(tdUserNome);

                tabelaCorpo.appendChild(tr);
            });
        }

        document.getElementById('btn-filtrar').addEventListener('click', () => {
            buscarCategoriasAdmin(inputFiltroId.value);
        });

        document.getElementById('btn-limpar').addEventListener('click', () => {
            inputFiltroId.value = '';
            buscarCategoriasAdmin();
        });

        
        inicializarAdmin();
     </script>
</body>
</html>
