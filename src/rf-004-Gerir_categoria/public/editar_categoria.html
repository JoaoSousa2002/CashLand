<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar categoria — CashLand</title>
    <link rel="stylesheet" href="/template.css">
</head>

<body>
    <div class="loading-overlay" id="loading-overlay" role="status">
        <div class="loading-box">
            <p>Carregando...</p>
            <div class="spinning-wheel" aria-hidden="true"></div>
        </div>
    </div>

    <div class="loading-overlay" id="resultado-overlay" role="dialog" aria-modal="true"
        aria-labelledby="resultado-titulo" style="display: none;">
        <div class="loading-box dialogo-conteudo">
            <h2 id="resultado-titulo"></h2>
            <p id="resultado-mensagem" style="white-space: pre-line;"></p>
            <button id="fechar-resultado" type="button">Continuar</button>
        </div>
    </div>

    <div id="container" hidden>
        <div id="div-superior">

            <div id="div-nome-sistema">
                <a href="/tela-principal">
                    <h1>CashLand</h1>
                </a>
            </div>

            <div id="div-nav">
                <nav>
                    <a href="/tela-principal/listar-categoria">Gerir categorias</a>
                    <a href="/tela-principal/listar-contas">Gerir contas financeiras</a>
                </nav>
            </div>
            <div id="div-nome-usuario">
                <h3><span id="nome-usuario"></span></h3>
            </div>
            <div id="div-usuario">
                <a onclick="redirecionaTela()">
                    <img src="/User_icon_black.png" alt="icone usuario">
                </a>
            </div>
            <div id="form-logout">
                <form id="meuForm-Logout">
                    <input type="submit" value="Sair">
                </form>
            </div>

        </div>

        <main id="container-conteudo">
            <div class="cartao">
                <h2>Editar categoria</h2>
                <form id="form-categoria" novalidate>
                    <label for="id_categoria">ID da Categoria</label>
                    <input id="id_categoria" readonly disabled>

                    <label for="nome">Nome</label>
                    <input id="nome" required minlength="3" maxlength="100" aria-describedby="erro-nome">
                    <div id="erro-nome" aria-live="polite"></div>

                    <label for="descricao">Descrição</label>
                    <input id="descricao" minlength="3" maxlength="100" aria-describedby="erro-descricao">
                    <div id="erro-descricao" aria-live="polite"></div>

                    <div class="acoes-formulario">
                        <button type="button" onclick="window.history.back()"
                            class="btn-secondary">Voltar</button>
                        <button id="salvar" type="submit" disabled>Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="/protecao.js"></script>
    <script>
        // Captura os parâmetros corretos da URL
        const urlParams = new URLSearchParams(location.search);
        const idCat = urlParams.get('id');

        const loading = document.getElementById('loading-overlay');
        const resultado = document.getElementById('resultado-overlay');
        const conteudo = document.getElementById('container');
        const form = document.getElementById('form-categoria');
        const salvar = document.getElementById('salvar');
        const fechar = document.getElementById('fechar-resultado');

        const idCategoriaRecebido = new URLSearchParams(location.search).get('id');

        let voltarAoLogin = false;
        let sessaoPronta = false;
        let enviando = false;
        let usuarioGlobal = null;

        function MostrarErro(id, mensagem) {
            const elemento = document.getElementById(id);
            elemento.replaceChildren();
            if (mensagem) {
                const texto = document.createElement('h5');
                texto.textContent = mensagem;
                elemento.appendChild(texto);
            }
        }

        function mostrarErrosCampos(status, dados) {
            let exibiuErro = false;
            if (status === 400 && Array.isArray(dados.erros)) {
                dados.erros.forEach(erro => {
                    if (erro.campo === 'nome' || erro.campo === 'descricao') {
                        MostrarErro(`erro-${erro.campo}`, erro.mensagem);
                        exibiuErro = true;
                    }
                });
            } else if (status === 409 && dados.mensagem) {
                MostrarErro('erro-nome', dados.mensagem);
                exibiuErro = true;
            }
            return exibiuErro;
        }

        function mostrarResultado(sucesso, mensagem) {
            const titulo = document.getElementById('resultado-titulo');
            if (sucesso) {
                titulo.textContent = 'Sucesso';
                titulo.style.color = 'var(--sucesso)';
            } else {
                titulo.textContent = 'Não foi possível concluir';
                titulo.style.color = 'var(--erro)';
            }
            document.getElementById('resultado-mensagem').textContent = mensagem;
            resultado.style.display = 'flex';
            conteudo.inert = true;
            fechar.focus();
        }

        fechar.addEventListener('click', () => {
            resultado.style.display = 'none';
            conteudo.inert = false;
            if (voltarAoLogin) location.href = '/login';
            else salvar.focus();
        });

        async function redirecionaTela() {
            const usuario = await protegerPagina();
            if (!usuario) return;
            if (usuario.tipo === 'Admin') {
                window.location.href = `/tela-admin/editar-usuarios?id=${usuario.id_usuario}`;
            } else {
                window.location.href = '/tela-principal/editar-usuario';
            }
        }

        document.getElementById('meuForm-Logout').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            loading.style.display = 'flex';
            try {
                const resposta = await fetch('/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                if (!resposta.ok) throw new Error('Falha ao sair. Tente novamente.');

                localStorage.removeItem('tipo');
                window.location.href = '/login';
            } catch (erro) {
                mostrarResultado(false, erro.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        async function carregarDadosCategoria() {
            try {
                const resposta = await fetch(`/usuario/listar-categoria?pesquisa=${encodeURIComponent(idCat)}`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!resposta.ok) {
                    throw new Error('Falha ao carregar categorias. ');
                }

                const categorias = await resposta.json();
                let dadosResposta = null;
                if (Array.isArray(categorias)) {
                    dadosResposta = categorias.find(categoria => Number(categoria.id_categoria) === Number(idCat));
                }


                if (!dadosResposta) {
                    mostrarResultado(false, 'Categoria não encontrada. Verifique os IDs.');
                    salvar.disabled = true;
                    return false;
                }

                console.log(dadosResposta.id_categoria)
                document.getElementById('id_categoria').value = dadosResposta.id_categoria;
                document.getElementById('nome').value = dadosResposta.nome;
                document.getElementById('descricao').value = dadosResposta.descricao || '';
                return true;
            } catch (erro) {
                mostrarResultado(false, 'Erro ao comunicar com a API para buscar dados. ' + erro.message);
                return false;
            }
        }

        async function iniciar() {
            if (!idCategoriaRecebido) {
                alert('ID da categoria não fornecido na URL.');
                window.history.back();
                return;
            }

            loading.style.display = 'flex';
            try {
                const usuario = await protegerPagina();
                if (!usuario) return;

                usuarioGlobal = usuario;
                document.getElementById('nome-usuario').textContent = usuario.nome.slice(0, 8);
                const categoriaCarregada = await carregarDadosCategoria();

                conteudo.hidden = false;
                sessaoPronta = categoriaCarregada;
                salvar.disabled = !sessaoPronta;
            } finally {
                loading.style.display = 'none';
            }
        }

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            if (!sessaoPronta || enviando) return;

            MostrarErro('erro-nome', '');
            MostrarErro('erro-descricao', '');
            enviando = true;
            salvar.disabled = true;
            loading.style.display = 'flex';

            try {
                const resposta = await fetch('/usuario/editar-categoria', {
                    method: 'PATCH',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_categoria: parseInt(idCategoriaRecebido),
                        nome: document.getElementById('nome').value.trim(),
                        descricao: document.getElementById('descricao').value.trim()
                    })
                });

                const tipo = resposta.headers.get('content-type') || '';
                if (!tipo.includes('application/json')) {
                    mostrarResultado(false, `Resposta inesperada da API (HTTP ${resposta.status}).`);
                    return;
                }

                const dados = await resposta.json();
                let mensagem = dados.mensagem || dados.erro;
                if (!mensagem) {
                    if (resposta.ok) {
                        mensagem = 'Operação concluída.';
                    } else {
                        mensagem = `Falha (HTTP ${resposta.status}).`;
                    }
                }

                if (!resposta.ok) {
                    voltarAoLogin = resposta.status === 401;
                    const exibiuErro = mostrarErrosCampos(resposta.status, dados);
                    if (!exibiuErro) {
                        if (Array.isArray(dados.erros)) {
                            mensagem += '\n' + dados.erros.map(erro => erro.mensagem).join('\n');
                        }
                        mostrarResultado(false, mensagem);
                    }
                    return;
                }

                mostrarResultado(true, mensagem);
            } catch {
                mostrarResultado(false, 'Não foi possível confirmar o resultado. Verifique a conexão.');
            } finally {
                loading.style.display = 'none';
                enviando = false;
                salvar.disabled = voltarAoLogin;
            }
        });

        iniciar();
    </script>
</body>

</html>
