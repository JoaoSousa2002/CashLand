<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerir cadastro</title>
    <link rel="stylesheet" href="/template.css">
</head>
<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-box">
            <div style="margin: auto 0;">
                <p>Carregando... </p>
            </div>
            <div class="spinning-wheel"></div>
        </div>
    </div>

    <div class="loading-overlay" id="resultado-overlay">
        <div class="loading-box" id="resultado-funcao">
        </div>
    </div>
    <div id="container">
        <div id="div-superior">
            <div id="div-superior">

            <div id="div-nome-sistema">
                <a href="/tela-principal">
                    <h1>CashLand</h1>
                </a>
            </div>

            <div id="div-nav">
                <nav>
                    <!-- <a href="/Usuarios">Usuarios</a> -->
                </nav>
            </div>
            <div id="div-nome-usuario">
                <h3><span id="nome-usuario"></span></h3>
            </div>
            <div id="div-usuario">
                <img src="/User_icon_black.png" alt="icone usuario">
            </div>
            <div id="form-logout">
                <form id="meuForm-Logout">
                    <input type="submit" value="Sair">
                </form>
            </div>
        </div>
        </div>
        <div id="div-form-tabela">
            <form id="form-listar-usuarios">
                <label for="id-ou-nome">Nome ou id do usuario:
                    <input type="text" id="id-ou-nome">
                </label>
                <input type="submit" value="Pesquisar">
                <input type="button" onclick="location.href='AdicionarObjetivo.html'" value="Adicionar objetivo">
            </form>
        </div>
        <div id="div-tabela">
            <table>
                <thead>
                    <tr>
                        <th scope="col" style="width: 80px;">id</th>
                        <th scope="col" style="width: 250px;">nome</th>
                        <th scope="col" style="width: 250px;">email</th>
                        <th scope="col" style="width: 120px;">tipo</th>
                        <th scope="col" style="width: 150px;">status</th>
                        <th scope="col" style="width: 150px;">data criação</th>
                        <th scope="col" style="width: 80px;">data desativação</th>
                        <th scope="col" style="width: 80px;">Opções</th>
                    </tr>

                </thead>
                <tbody id="corpo-tabela">
                    <!-- Esse campo será preenchido pela função RenderizarTabelaHistorico pelo Javascript-->
                </tbody>
            </table>
        </div>
    </div>


    <script>
        let retornarLogin = false;
        let retornarTelaPrincipal = false;
        let recarregarPagina = false
        const loading = document.getElementById("loading-overlay");
        const resultado_overlay = document.getElementById("resultado-overlay");

        loading.style.display = 'flex'

        function MostrarResultado_Overlay(tipo, mensagem) {
            if (tipo == 1) {
                document.getElementById("resultado-funcao").innerHTML =
                    `<div id="div-resultado-overlay"
                    style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px;">
                    <div>
                        <h5 style="color: rgb(103, 198, 40); margin: 0;">${mensagem}</h5>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: center;">
                     <input style="width: 100px;" type="button" onclick="FechaResultado_overlay(1)" value="Continuar">
                    </div>
                </div>`
            } else {
                document.getElementById("resultado-funcao").innerHTML =
                    `<div id="div-resultado-overlay"
                    style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center gap: 20px;">
                    <div>
                        <h5 style="color: rgb(160, 2, 2); margin: 0;">${mensagem}</h5>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: center;">
                     <input style="width: 100px;" type="button" onclick="FechaResultado_overlay(1)" value="Continuar">
                    </div>
                </div>`
            }
        }
        function FechaResultado_overlay(num) {
            if (num === 1) {
                resultado_overlay.style.display = "none"
                if (retornarLogin) {
                    window.location.href = "/login"
                } else if (retornarTelaPrincipal) {
                    window.location.href = '/tela-principal';
                } else if (recarregarPagina) {
                    location.reload();
                }
            } else {

            }
        }

        function confirmarDelete(id) {
            resultado_overlay.style.display = "flex";
            document.getElementById("resultado-funcao").innerHTML =
                    `<div id="div-resultado-overlay"
                    style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px;">
                    <div>
                        <h5 style="color: rgb(160, 2, 2); margin: 0;">Tem certeza que deseja deletar esse usuario?</h5>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: center;">
                     <input style="width: 100px;" type="button" onclick="excluir(${id})" value="Continuar">
                     <input style="width: 100px;" type="button" onclick="resultado_overlay.style.display = 'none'" value="Cancelar">
                    </div>
                </div>`
        }
        async function protegerPagina(tipoExigido = null) {

            try {
                const resposta = await fetch('/me', {
                    method: 'GET',
                    credentials: 'include',
                });
                const usuario = await resposta.json();
                switch (resposta.status) {
                    case 200:
                        loading.style.display = 'none'
                        console.log("Usuario autenticado")
                        break;
                    case 401:
                        loading.style.display = 'none'
                        resultado_overlay.style.display = "flex";
                        MostrarResultado_Overlay(0, usuario.mensagem)
                        console.log(usuario.mensagem)
                        retornarLogin = true;
                    default:
                        break;
                }

                if (tipoExigido && usuario.tipo !== tipoExigido) {
                    lloading.style.display = 'none'
                    console.log("Acesso negado")
                    resultado_overlay.style.display = "flex";
                    MostrarResultado_Overlay(0, "Acesso restrito a administradores!")
                    retornarTelaPrincipal = true;
                }

                return usuario; // devolve os dados pra página usar (ex: mostrar nome)
            } catch {
                localStorage.removeItem('tipo');
                window.location.href = '/login';
            }
        }


        protegerPagina("Admin").then(usuario => {
            document.getElementById('nome-usuario').textContent = usuario.nome.slice(0, 8);
        });

        async function editar(id) {
            window.location.href = `/tela-admin/editar-usuarios?id=${id}`
        }
        // =======================================================================================================
        async function excluir(id) {
            resultado_overlay.style.display = "none";

            const response = await fetch(`/admin/deletar-usuario/?id_usuario=${id}`, {
                method: 'DELETE',
                credentials: 'include'
            })
            const data = await response.json()

            if (response.status === 200) {
                resultado_overlay.style.display = "flex";
                MostrarResultado_Overlay(1, data.mensagem)
                recarregarPagina = true;
                console.log(data.mensagem)
            } else {
                resultado_overlay.style.display = "flex";
                MostrarResultado_Overlay(2, data.mensagem)
                console.log(data.mensagem)
            }
        }
        //  GET /logout

        document.getElementById("meuForm-Logout").addEventListener("submit", async (e) => {
            e.preventDefault();
            resposta = await fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            });
            console.log(resposta.mensagem)

            localStorage.removeItem('tipo');
            window.location.href = '/login';
        });

        document.getElementById("form-listar-usuarios").addEventListener("submit", async (e) => {
            e.preventDefault();
            const pesquisa = document.getElementById("id-ou-nome").value

            const resposta = await fetch(`/admin/listar-usuarios/?pesquisa=${pesquisa}`, {
                method: 'GET',
                credentials: 'include'
            });
            const usuario = await resposta.json();
            console.log(usuario)


            switch (resposta.status) {
                case 200:
                case 201:
                    document.getElementById('corpo-tabela').innerHTML = usuario.map(c =>
                        `
                    <tr>
                        <td>${c.id_usuario}</td>
                        <td>${c.nome}</td>
                        <td>${c.email}</td>
                        <td>${c.tipo}</td>
                        <td>${c.status_usuario}</td>
                        <td>${c.data_criacao ? new Date(c.data_criacao).toLocaleDateString('pt-BR') : '---'}</td>
                        <td>${c.data_inativacao ? new Date(c.data_inativacao).toLocaleDateString('pt-BR') : '---'}</td>
                        <td>
                            <button onclick="editar(${c.id_usuario})">Ver/Editar</button>
                        <br>
                            <button onclick="confirmarDelete(${c.id_usuario})">Excluir</button>
                        </td>
                        </tr>
                `).join("");
                    break;
                default:
                    break;
            }

        })
    </script>
</body>

</html>
