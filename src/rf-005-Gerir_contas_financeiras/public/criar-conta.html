<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/CashLand%20emerald%20C%20icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — CashLand</title>
    <link rel="stylesheet" href="/template.css">
    <script src="/menu-superior.js" defer></script>
</head>

<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-box">
            <div style="margin: auto 0;">
                <p>Carregando... </p>
            </div>
            <div class="spinning-wheel"></div>
        </div>
    </div>

    <div class="loading-overlay" id="resultado-overlay">
        <div class="loading-box" id="resultado-funcao">
            <div id="div-resultado-overlay"
                class="dialogo-conteudo">
                <h5 id="resultado-mensagem" style="margin: 0;"></h5>
                <input class="botao-dialogo" type="button" onclick="FechaResultado_overlay()" value="Continuar">
            </div>
        </div>
    </div>
    <div id="container">
        <div id="div-superior">

            <div id="div-nome-sistema">
                <a href="/tela-principal">
                    <h1>CashLand</h1>
                </a>
            </div>

            <div id="div-nav">
                <button id="botao-opcoes" type="button" aria-expanded="false" aria-controls="lista-opcoes">
                    Opções <span aria-hidden="true">▾</span>
                </button>
                <nav id="lista-opcoes" aria-label="Opções de navegação" hidden>
                    <a href="/tela-principal/listar-categoria">Gerir categorias</a>
                    <a href="/tela-principal/listar-contas">Gerir contas financeiras</a>
                    <a href="/tela-principal/criar-transacao">Adicionar transação</a>
                    <a href="/tela-principal/listar-transacoes">Gerir transações</a>
                    <a href="/tela-principal/listar-metas">Gerir metas</a>
                </nav>
            </div>
            <div id="div-resumo-usuario">
                <div id="div-saldo-usuario">
                    <button id="botao-saldo-usuario" type="button" aria-expanded="false" aria-controls="lista-contas-saldo">
                        <small>Saldo atual <span aria-hidden="true">▾</span></small>
                        <strong id="saldo-usuario" aria-live="polite">Carregando...</strong>
                        <small id="nome-conta-saldo">Selecionar conta</small>
                    </button>
                    <div id="lista-contas-saldo" hidden>
                        <label for="conta-saldo-usuario">Conta financeira</label>
                        <select id="conta-saldo-usuario" size="3" disabled></select>
                    </div>
                </div>
                <div id="div-nome-usuario">
                    <h3><span id="nome-usuario"></span></h3>
                </div>
            </div>
            <div id="div-usuario">
                <a onclick="redirecionaTela()">
                    <img src="/User_icon_black.png" alt="icone usuario">
                </a>
            </div>
            <div id="form-logout">
                <form id="meuForm-Logout">
                    <input type="submit" value="Sair">
                </form>
            </div>
        </div>
        <div id="container-conteudo">
            <div id="div-Cadastro" class="cartao">
                <div id="id-Titulo">
                    <h2>Criar conta</h2>
                    <input type="button" value="Voltar" id="botao-Voltar"
                        onclick="location.href='/tela-principal/listar-contas'">
                </div>
                <form id="meuForm" novalidate>
                    <div class="input-dados">
                        <label for="nome_conta">Nome da conta:</label>
                        <input type="text" name="nome_conta" id="nome_conta" placeholder="Ex: Conta principal" required minlength="2"
                            maxlength="100" aria-describedby="erro-nome_conta">
                    </div>
                    <div id="erro-nome_conta" aria-live="polite"></div>
                    <div class="input-dados">
                        <label for="tipo_conta">Tipo da conta:</label>
                        <select name="tipo_conta" id="tipo_conta" required aria-describedby="erro-tipo_conta">
                            <option value="">Selecione o tipo da conta</option>
                            <option value="Corrente">Corrente</option>
                            <option value="Poupança">Poupança</option>
                            <option value="Salario">Salario</option>
                            <option value="Conjunta">Conjunta</option>
                            <option value="Internacional">Internacional</option>
                            <option value="Credito">Credito</option>
                        </select>
                    </div>
                    <div id="erro-tipo_conta" aria-live="polite"></div>
                    <div id="grupo-data_fechamento" hidden>
                        <label for="data_fechamento">Dia de fechamento</label>
                        <input type="number" id="data_fechamento" name="data_fechamento" min="1" max="31" step="1" disabled aria-describedby="erro-data_fechamento">
                        <div id="erro-data_fechamento" aria-live="polite"></div>
                    </div>
                    <div id="grupo-data_vencimento" hidden>
                        <label for="data_vencimento">Dia de vencimento</label>
                        <input type="number" id="data_vencimento" name="data_vencimento" min="1" max="31" step="1" disabled aria-describedby="erro-data_vencimento">
                        <div id="erro-data_vencimento" aria-live="polite"></div>
                    </div>
                    <div class="input-dados">
                        <label for="nome_instituicao">Instituição (opcional):</label>
                        <input type="text" name="nome_instituicao" id="nome_instituicao" placeholder="Ex: Nome do banco"
                            minlength="2" maxlength="100" aria-describedby="erro-nome_instituicao">
                    </div>
                    <div id="erro-nome_instituicao" aria-live="polite"></div>
                    <div class="input-dados">
                        <label for="codigo_conta">Código da conta (opcional):</label>
                        <input type="number" name="codigo_conta" id="codigo_conta" min="0" step="1"
                            placeholder="Ex: 123" aria-describedby="erro-codigo_conta">
                    </div>
                    <div id="erro-codigo_conta" aria-live="polite"></div>
                    <div id="input-submit">
                        <input type="submit" value="Criar conta" id="botao-Enviar" disabled>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/protecao.js"></script>
    <script>

        function atualizarDiasConta() {
            const credito = document.getElementById('tipo_conta').value === 'Credito';
            for (const id of ['data_fechamento', 'data_vencimento']) {
                const campo = document.getElementById(id);
                document.getElementById(`grupo-${id}`).hidden = !credito;
                campo.disabled = !credito || document.getElementById('tipo_conta').disabled;
                campo.required = credito;
                if (!credito) campo.value = '';
            }
        }
        function diasConta() {
            const credito = document.getElementById('tipo_conta').value === 'Credito';
            return Object.fromEntries(['data_fechamento', 'data_vencimento'].map(id =>
                [id, credito && document.getElementById(id).value !== '' ? Number(document.getElementById(id).value) : null]));
        }
        document.getElementById('tipo_conta').addEventListener('change', atualizarDiasConta);

        let retonarLogin = false;
        let sessaoPronta = false;
        let enviando = false;
        const loading = document.getElementById('loading-overlay');
        const resultado_overlay = document.getElementById('resultado-overlay');
        const form = document.getElementById('meuForm');
        const botaoEnviar = document.getElementById('botao-Enviar');

        function MostrarErro(id, mensagem) {
            const elemento = document.getElementById(id);
            if (!elemento) return;
            elemento.replaceChildren();
            if (mensagem) {
                const texto = document.createElement('h5');
                texto.style.color = 'var(--erro)';
                texto.textContent = mensagem;
                elemento.appendChild(texto);
            }
        }

        function MostrarResultado_Overlay(tipo, mensagem) {
            const texto = document.getElementById('resultado-mensagem');
            texto.textContent = mensagem;
            if (tipo === 1) {
                texto.style.color = 'var(--sucesso)';
            } else {
                texto.style.color = 'var(--erro)';
            }
            resultado_overlay.style.display = 'flex';
        }

        function FechaResultado_overlay() {
            resultado_overlay.style.display = 'none';
            if (retonarLogin) {
                window.location.href = '/login';
            }
        }

        function mensagemResposta(resposta, dados) {
            if (resposta.status === 401) {
                retonarLogin = true;
                sessaoPronta = false;
                botaoEnviar.disabled = true;
            }
            if (dados && dados.mensagem) {
                return dados.mensagem;
            } else if (dados && dados.erro) {
                return dados.erro;
            } else {
                return `Não foi possível concluir a operação (HTTP ${resposta.status}).`;
            }
        }

        async function redirecionaTela() {
            const usuario = await protegerPagina();
            if (!usuario) return;
            if (usuario.tipo === 'Comum') {
                window.location.href = '/tela-principal/editar-usuario';
            } else if (usuario.tipo === 'Admin') {
                window.location.href = `/tela-admin/editar-usuarios?id=${usuario.id_usuario}`;
            }
        }

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            if (!sessaoPronta || enviando) return;
            enviando = true;
            botaoEnviar.disabled = true;
            loading.style.display = 'flex';
            MostrarErro('erro-nome_conta', '');
            MostrarErro('erro-tipo_conta', '');
            MostrarErro('erro-data_fechamento', '');
            MostrarErro('erro-data_vencimento', '');
            MostrarErro('erro-nome_instituicao', '');
            MostrarErro('erro-codigo_conta', '');
            const nome_conta = document.getElementById('nome_conta').value.trim();
            const tipo_conta = document.getElementById('tipo_conta').value;
            const nome_instituicao = document.getElementById('nome_instituicao').value.trim();
            const codigo_conta = document.getElementById('codigo_conta').value.trim();
            try {
                const resposta = await fetch('/usuario/criar-conta', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...diasConta(), nome_conta, tipo_conta, nome_instituicao, codigo_conta: codigo_conta === '' ? null : codigo_conta })
                });
                const dados = await resposta.json();
                if (resposta.status === 200) {
                    atualizarSaldoUsuario();
                    form.reset();
                    MostrarResultado_Overlay(1, dados.mensagem);
                } else {
                    if (resposta.status === 400 && Array.isArray(dados.erros)) {
                        dados.erros.forEach(erro => {
                            MostrarErro(`erro-${erro.campo}`, erro.mensagem);
                        });
                    } else {
                        MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                    }
                }
            } catch {
                MostrarResultado_Overlay(0, 'Não foi possível confirmar o cadastro. Consulte suas contas antes de tentar novamente.');
            } finally {
                loading.style.display = 'none';
                enviando = false;
                botaoEnviar.disabled = !sessaoPronta;
            }
        });

        document.getElementById('meuForm-Logout').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            loading.style.display = 'flex';
            try {
                const resposta = await fetch('/logout', { method: 'POST', credentials: 'include' });
                const dados = await resposta.json();
                if (resposta.status === 200) {
                    localStorage.removeItem('tipo');
                    window.location.href = '/login';
                } else {
                    MostrarResultado_Overlay(0, mensagemResposta(resposta, dados));
                }
            } catch {
                MostrarResultado_Overlay(0, 'Não foi possível sair. Tente novamente.');
            } finally {
                loading.style.display = 'none';
            }
        });

        async function iniciar() {
            loading.style.display = 'flex';
            try {
                const usuario = await protegerPagina();
                if (!usuario) return;
                document.getElementById('nome-usuario').textContent = usuario.nome.slice(0, 8);
                atualizarSaldoUsuario(usuario.id_usuario);
                sessaoPronta = true;
                botaoEnviar.disabled = !sessaoPronta;
            } finally {
                loading.style.display = 'none';
            }
        }

        iniciar();
        new MutationObserver(atualizarDiasConta).observe(document.getElementById('tipo_conta'), { attributes: true, attributeFilter: ['disabled'] });
        document.getElementById('tipo_conta').closest('form').addEventListener('reset', () => setTimeout(atualizarDiasConta, 0));
        atualizarDiasConta();
    </script>
</body>

</html>
